[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "aoiro"
version = "1.0.3"
description = "CSV-based 青色申告 CLI app"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "account-codes-jp>=0.4.32",
  "attrs>=25.4",
  "cyclopts>=3.24",
  "dateparser>=1.3",
  "networkx>=3.4.2",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "requests-cache>=1.3",
  "rich>=10",
]
urls."Bug Tracker" = "https://github.com/34j/aoiro/issues"
urls.Changelog = "https://github.com/34j/aoiro/blob/main/CHANGELOG.md"
urls.documentation = "https://aoiro.readthedocs.io"
urls.repository = "https://github.com/34j/aoiro"
scripts.aoiro = "aoiro.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest==9.*",
  "pytest-cov==7.*",
  "sybil[pytest]>=10.1",
  "ty",
]
docs = [
  "furo>=2025.12.19; python_full_version>='3.12'",
  "myst-parser>=5.1; python_full_version>='3.12'",
  "packaging-34j[docs]",
  "sphinx==9.*; python_full_version>='3.12'",
  "sphinx-autobuild>=2025.8.25; python_full_version>='3.12'",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-ignore = [ "ANN401", "COM812", "CPY001", "D212", "EM101", "EM102", "TRY003" ]
lint.per-file-ignores."tests/**/*" = [ "S603" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
